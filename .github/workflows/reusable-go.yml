# Reusable Go CI — the azrtydxb standard.
#
# Called by product repos with `uses: azrtydxb/.github/.github/workflows/reusable-go.yml@main`.
# Defaults to the org's arm64 self-hosted runner (`arc-azrtydxb`), which is the
# only general-purpose runner platform we maintain (kw + OKE are arm64).
#
# The caller still owns the trigger, `concurrency`, path filters and the single
# required `gate` check; this workflow owns the toolchain, caching and the
# build/vet/lint/test sequence so every Go repo behaves the same.
#
# TIERS — see docs/ci-standard.md §Test tiers.
#   unit        (default) PR / commit gate. Static checks + hermetic unit tests.
#               Must finish well under 5 minutes. Integration tests must be
#               behind `//go:build integration` so they are NOT compiled here.
#   integration nightly. unit + `-tags integration` (services, containers, db).
#   full        versioned release. integration + race + coverage.
name: reusable-go

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Use arc-azrtydxb (arm64) unless x86 is required.
        type: string
        default: arc-azrtydxb
      working-directory:
        description: Directory holding go.mod.
        type: string
        default: "."
      go-version-file:
        description: Path to the go.mod (or .go-version) that pins the toolchain.
        type: string
        default: go.mod
      tier:
        description: unit | integration | full (see docs/ci-standard.md §Test tiers).
        type: string
        default: unit
      race:
        description: Force `-race` regardless of tier (needs CGO_ENABLED=1 and a C compiler).
        type: boolean
        default: false
      lint:
        description: Run golangci-lint.
        type: boolean
        default: true
      integration-tags:
        description: Build tag guarding integration tests.
        type: string
        default: integration
      timeout:
        description: Job timeout in minutes. Keep the unit tier small.
        type: number
        default: 30

permissions:
  contents: read
  id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)

jobs:
  go:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::gofmt needed on:"; echo "$files"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        if: ${{ inputs.lint }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ${{ inputs.working-directory }}

      # unit: hermetic only. integration tests live behind `//go:build integration`.
      - name: go test (unit)
        if: ${{ inputs.tier == 'unit' }}
        env:
          CGO_ENABLED: ${{ inputs.race && '1' || '0' }}
        run: go test ${{ inputs.race && '-race' || '' }} ./...

      # nightly: add the tagged integration suite.
      - name: go test (unit + integration)
        if: ${{ inputs.tier == 'integration' }}
        env:
          CGO_ENABLED: ${{ inputs.race && '1' || '0' }}
        run: go test ${{ inputs.race && '-race' || '' }} -tags ${{ inputs.integration-tags }} -timeout 20m ./...

      # release: integration + race + coverage.
      - name: "go test (full: race + integration + coverage)"
        if: ${{ inputs.tier == 'full' }}
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags ${{ inputs.integration-tags }} -covermode=atomic -coverprofile=coverage.out -timeout 30m ./...

      - name: Upload coverage
        if: ${{ inputs.tier == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: ${{ inputs.working-directory }}/coverage.out
          if-no-files-found: ignore
