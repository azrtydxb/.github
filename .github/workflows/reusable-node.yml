# Reusable Node/TypeScript CI — the azrtydxb standard.
#
# Covers npm, pnpm and yarn. typecheck/lint/test/build run only when the script
# exists, so the same workflow serves a library and a full app. Use `pre-scripts`
# for codegen that must run before the checks (e.g. `prisma generate`).
#
# TIERS — see docs/ci-standard.md §Test tiers.
#   unit        (default) PR / commit gate. typecheck + lint + unit `test` + build.
#               Must finish well under 5 minutes. No servers, browsers or e2e.
#   integration nightly. unit + the `test:integration` script (services, db).
#   full        versioned release. unit + integration + the `test:e2e` script.
name: reusable-node

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Use arc-azrtydxb (arm64) unless x86 is required.
        type: string
        default: arc-azrtydxb
      working-directory:
        description: Directory holding package.json.
        type: string
        default: "."
      node-version:
        description: Node version passed to actions/setup-node.
        type: string
        default: "22"
      package-manager:
        description: npm | pnpm | yarn
        type: string
        default: npm
      lockfile:
        description: Lockfile name used for the cache key (matches package-manager).
        type: string
        default: package-lock.json
      tier:
        description: unit | integration | full (see docs/ci-standard.md §Test tiers).
        type: string
        default: unit
      pre-scripts:
        description: Shell command(s) run after install and before the checks (codegen).
        type: string
        default: ""
      timeout:
        description: Job timeout in minutes. Keep the unit tier small.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  node:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.lockfile }}

      - name: install
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            *) echo "::error::unsupported package-manager"; exit 1 ;;
          esac

      - name: pre-scripts
        if: ${{ inputs.pre-scripts != '' }}
        run: ${{ inputs.pre-scripts }}

      # unit tier: static checks + unit test + build. Stops here on a PR.
      - name: typecheck / lint / test / build
        run: |
          run_if() {
            if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$1"; then
              echo "::group::$1"
              ${{ inputs.package-manager }} run "$1"
              echo "::endgroup::"
            else
              echo "no '$1' script; skipping"
            fi
          }
          run_if typecheck
          run_if lint
          run_if test
          run_if build

      # integration tier (nightly) and above: add the integration script if present.
      - name: test:integration
        if: ${{ inputs.tier == 'integration' || inputs.tier == 'full' }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:integration'] ? 0 : 1)"; then
            echo "::group::test:integration"
            ${{ inputs.package-manager }} run test:integration
            echo "::endgroup::"
          else
            echo "no 'test:integration' script; skipping"
          fi

      # full tier (versioned release): add e2e if present.
      - name: test:e2e
        if: ${{ inputs.tier == 'full' }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "::group::test:e2e"
            ${{ inputs.package-manager }} run test:e2e
            echo "::endgroup::"
          else
            echo "no 'test:e2e' script; skipping"
          fi
