# Reusable secret scan — the azrtydxb standard baseline for every repo.
#
# Deliberately small and fast: a full history gitleaks scan. Heavier scanners
# (trivy, CodeQL, govulncheck) stay opt-in per repo/language.
name: reusable-security

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label.
        type: string
        default: arc-azrtydxb
      timeout:
        description: Job timeout in minutes.
        type: number
        default: 15

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
