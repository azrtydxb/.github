# Reusable secret scan — the azrtydxb standard baseline for every repo.
#
# Deliberately small and fast: a full history gitleaks scan. Heavier scanners
# (trivy, CodeQL, govulncheck) stay opt-in per repo/language.
name: reusable-security

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label override. Empty (default) picks by caller visibility, arc-azrtydxb-amd64 (quadronix) for private repos and ubuntu-latest (GitHub-hosted) for public ones.
        type: string
        default: ""
      timeout:
        description: Job timeout in minutes.
        type: number
        default: 15

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'arc-azrtydxb-amd64' || 'ubuntu-latest') }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
