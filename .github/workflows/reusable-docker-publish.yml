# Reusable image build/push to Kuvryn Ant (ant.azrty.com/oci-hosted) — the azrtydxb standard.
#
# One job builds linux/amd64 and linux/arm64 together on the amd64 runner (private repos:
# quadronix `arc-azrtydxb-amd64`, public repos: GitHub-hosted `ubuntu-latest`). arm64 is
# cross-compiled, never emulated: the Dockerfile's build stages must be
# `FROM --platform=$BUILDPLATFORM` and its final stage must have no `RUN`. There is no
# QEMU/binfmt step here. Base images are
# pulled through the Kuvryn Ant mirror and layers are cached on the Kuvryn Ant buildcache feed
# (via ant-setup-action build-cache), so an ephemeral runner never starts a cold build. kw replicates oci-hosted.
#
# Login is GitHub OIDC through azrtydxb/ant-setup-action: no stored secret. The
# caller must grant `permissions: id-token: write` (main, master and v* tags get a
# publish token, other refs read-only).
name: reusable-docker-publish

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label override. Empty (default) picks by caller visibility, arc-azrtydxb-amd64 (quadronix) for private repos and ubuntu-latest (GitHub-hosted) for public ones.
        type: string
        default: ""
      image:
        description: Image name under the registry, e.g. azrtydxb/novamail-web.
        type: string
        required: true
      context:
        description: Build context.
        type: string
        default: "."
      file:
        description: Path to the Dockerfile (empty uses <context>/Dockerfile).
        type: string
        default: ""
      target:
        description: Docker build target stage (empty = final stage).
        type: string
        default: ""
      platforms:
        description: Target platforms, built in one job by cross-compilation (no QEMU). Dockerfile build stages must be FROM --platform=$BUILDPLATFORM and the final stage must have no RUN.
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: Newline-separated build args.
        type: string
        default: ""
      push:
        description: Push on push events (never pushes on pull_request).
        type: boolean
        default: true
      timeout:
        description: Job timeout in minutes.
        type: number
        default: 30
    secrets:
      # Deprecated and unused (the Nexus login is gone); kept optional so existing
      # callers that pass them do not break.
      NEXUS_USER:
        required: false
      NEXUS_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ant.azrty.com/oci-hosted

jobs:
  publish:
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'arc-azrtydxb-amd64' || 'ubuntu-latest') }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v7

      # Docker Hub is reached through the Kuvryn Ant mirror, never anonymously.
      # The 192.168.10.131 entries only matter for base images still named there.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."192.168.10.131"]
              insecure = true
            [registry."192.168.10.131:5000"]
              insecure = true
            [registry."docker.io"]
              mirrors = ["ant.azrty.com"]

      - id: ant
        uses: azrtydxb/ant-setup-action@v1
        with:
          build-cache: "true"
          cache-name: ${{ inputs.image }}
          cache-write: ${{ inputs.push && github.event_name == 'push' }}
          docker-login: "true"
          required: ${{ inputs.push && github.event_name == 'push' }}
          go: "false"
          cargo: "false"
          pip: "false"

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            COMMIT=${{ github.sha }}
            ${{ inputs.build-args }}
          # Only a push writes the cache, so an untrusted pull request can never
          # poison the layers main builds from.
          push: ${{ inputs.push && github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image }}:sha-${{ github.sha }}
          cache-from: ${{ steps.ant.outputs.cache-from }}
          cache-to: ${{ steps.ant.outputs.cache-to }}
