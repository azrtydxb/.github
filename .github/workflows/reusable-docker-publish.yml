# Reusable image build/push to the Nexus registry — the azrtydxb standard.
#
# Runs on the arm64 publish set (everything we deploy is arm64). Base images are
# pulled through the home registry mirror and layers are cached in Nexus, so an
# ephemeral runner never starts a cold build.
#
# Callers must pass the registry credentials: `secrets: inherit`.
name: reusable-docker-publish

on:
  workflow_call:
    inputs:
      runner:
        description: Publish runner label.
        type: string
        default: arc-azrtydxb
      image:
        description: Image name under the registry, e.g. azrtydxb/novamail-web.
        type: string
        required: true
      context:
        description: Build context.
        type: string
        default: "."
      file:
        description: Path to the Dockerfile (empty uses <context>/Dockerfile).
        type: string
        default: ""
      target:
        description: Docker build target stage (empty = final stage).
        type: string
        default: ""
      platforms:
        description: Target platforms. Default is arm64-only; add linux/amd64 only if a consumer needs it.
        type: string
        default: linux/arm64
      build-args:
        description: Newline-separated build args.
        type: string
        default: ""
      push:
        description: Push on push events (never pushes on pull_request).
        type: boolean
        default: true
      timeout:
        description: Job timeout in minutes.
        type: number
        default: 30
    secrets:
      NEXUS_USER:
        required: true
      NEXUS_PASSWORD:
        required: true

permissions:
  contents: read

env:
  REGISTRY: 192.168.10.131:5000

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BuildKit runs in its own container and does not inherit the host trust
      # store: both Nexus ports need the insecure exemption, and Docker Hub is
      # reached through the mirror, never anonymously.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."192.168.10.131"]
              insecure = true
            [registry."192.168.10.131:5000"]
              insecure = true
            [registry."docker.io"]
              mirrors = ["ant.azrty.com"]

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            COMMIT=${{ github.sha }}
            ${{ inputs.build-args }}
          # Only a push writes the cache, so an untrusted pull request can never
          # poison the layers main builds from.
          push: ${{ inputs.push && github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ inputs.image }}:main
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/${{ inputs.image }}:arm64
          cache-to: ${{ inputs.push && github.event_name == 'push' && format('type=registry,ref={0}/buildcache/{1}:arm64,mode=max,image-manifest=true,ignore-error=true', env.REGISTRY, inputs.image) || '' }}
