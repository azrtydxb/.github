# Reusable Python CI — the azrtydxb standard.
#
# TIERS — see docs/ci-standard.md §Test tiers.
#   unit        (default) PR / commit gate. ruff + hermetic pytest
#               (`-m "not integration and not e2e"`). Must finish well under 5 minutes.
#   integration nightly. ruff + pytest without e2e (`-m "not e2e"`).
#   full        versioned release. whole suite (all markers).
#
# Mark integration/e2e tests so they can be selected:
#   @pytest.mark.integration   needs services / network / db
#   @pytest.mark.e2e           full end-to-end
name: reusable-python

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Use arc-azrtydxb (arm64) unless x86 is required.
        type: string
        default: arc-azrtydxb
      working-directory:
        description: Directory holding pyproject.toml / requirements.txt.
        type: string
        default: "."
      python-version:
        description: Python version for actions/setup-python.
        type: string
        default: "3.12"
      tier:
        description: unit | integration | full (see docs/ci-standard.md §Test tiers).
        type: string
        default: unit
      install:
        description: Shell command that installs the project and test deps.
        type: string
        default: "pip install -e '.[dev]' || pip install -r requirements.txt"
      timeout:
        description: Job timeout in minutes. Keep the unit tier small.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/**/requirements*.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install }}

      - name: ruff
        run: |
          if command -v ruff >/dev/null; then ruff check .; else echo "ruff not installed; skipping"; fi

      - name: pytest (unit)
        if: ${{ inputs.tier == 'unit' }}
        run: python -m pytest -q -m "not integration and not e2e"

      - name: pytest (unit + integration)
        if: ${{ inputs.tier == 'integration' }}
        run: python -m pytest -q -m "not e2e"

      - name: pytest (full)
        if: ${{ inputs.tier == 'full' }}
        run: python -m pytest -q
