# Example caller — copy into a repo's .github/workflows/dependabot-automerge.yml
name: dependabot-automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: azrtydxb/.github/.github/workflows/reusable-dependabot-automerge.yml@main
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
