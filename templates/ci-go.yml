# Example Go caller — the shape every Go repo should converge on.
# Replace the language workflow with reusable-node/rust/python as needed.
#
# This is the PR/commit tier only: fast, hermetic unit tests. Integration and
# e2e work belongs in nightly-integration.yml / release-full.yml (also in
# templates/). See docs/ci-standard.md §Test tiers.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    uses: azrtydxb/.github/.github/workflows/reusable-go.yml@main
    with:
      tier: unit
      working-directory: .
      race: false
      lint: true

  security:
    uses: azrtydxb/.github/.github/workflows/reusable-security.yml@main

  gate:
    if: always()
    needs: [go, security]
    runs-on: arc-azrtydxb
    timeout-minutes: 5
    steps:
      - name: Verify
        run: |
          [ "${{ needs.go.result }}" = "success" ] &&
          [ "${{ needs.security.result }}" = "success" ] || exit 1
